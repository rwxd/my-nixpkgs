name: Update packages

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    name: Update ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - best-of
          - dnsbl-exporter
          - immich-wallpaper-sync
          - notify-me
          - pdnsgrep
          - vmrss
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 2G

      - name: Materialize flake source
        # nix flake metadata alone can return an unmaterialized store path on
        # GitHub Actions, which breaks nix-update's nested builtins.getFlake.
        run: nix flake archive > /dev/null

      - name: Generate GitHub App token
        id: app-token
        if: ${{ vars.UPDATE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update package
        run: |
          # Run the binary directly: `nix run`/`nix develop` inject build-env
          # variables that break nix-update's nested flake lookups.
          nix_update="$(nix build --inputs-from . nixpkgs#nix-update --no-link --print-out-paths)/bin/nix-update"
          "$nix_update" --flake --build --format "${{ matrix.package }}"

      - name: Create pull request
        # An app token is preferred: PRs created with GITHUB_TOKEN do not trigger
        # further GitHub Actions workflows, so CI would not run on them.
        # UPDATE_TOKEN is supported as a PAT fallback.
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token || secrets.UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          branch: update/${{ matrix.package }}
          delete-branch: true
          title: "chore(deps): update ${{ matrix.package }}"
          commit-message: "chore(deps): update ${{ matrix.package }}"
          body: |
            Automated update of `${{ matrix.package }}` via `nix-update`.

            The package was rebuilt successfully before this pull request was opened.
          labels: |
            automated
            dependencies
          assignees: rwxd
